title: OpenSwarm
description: Keyboard-first TUI for parallel AI agent deployment across Git worktrees
theme: just-the-docs
color_scheme: dark

url: https://github.com/Matars/OpenSwarm
baseurl: ""

aux_links:
  openswarm on GitHub: https://github.com/Matars/OpenSwarm

just_the_docs:
  show_sidebar: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

search_enabled: true
heading_anchors: true

sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions
