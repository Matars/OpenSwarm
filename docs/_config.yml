title: OpenSwarm
description: Keyboard-first TUI for parallel AI agent deployment across Git worktrees
remote_theme: just-the-docs/just-the-docs
color_scheme: dark

url: https://matars.github.io
baseurl: /OpenSwarm

plugins:
  - jekyll-remote-theme

aux_links:
  GitHub: https://github.com/Matars/OpenSwarm

defaults:
  - scope:
      path: ""
    values:
      layout: default

search_enabled: true
heading_anchors: true

sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions
