site_name: OpenSwarm Docs
site_description: Parallel agent workflows over Git worktrees
site_url: https://example.com/openswarm
repo_name: openswarm
repo_url: https://example.com/openswarm

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Tutorials:
      - First Parallel Workflow: tutorials/first-parallel-workflow.md
      - Ship Feature with 3 Worktrees: tutorials/ship-feature-with-3-worktrees.md
  - How-To Guides:
      - Create and Manage Worktrees: how-to/create-and-manage-worktrees.md
      - Commit and Push from Worktree: how-to/commit-push-from-worktree.md
      - Resolve Merge Conflicts with Agent: how-to/resolve-merge-conflicts-with-agent.md
      - Customize Agent and Prompts: how-to/customize-agent-and-prompts.md
  - Reference:
      - Keybindings: reference/keybindings.md
      - Configuration: reference/configuration.md
      - Notes and Popup Controls: reference/notes-and-popup-controls.md
      - Git Behavior and Safety: reference/git-behavior-and-safety.md
  - Explanation:
      - Why OpenSwarm: explanation/why-openswarm.md
      - Worktree Graph Model: explanation/worktree-graph-model.md
      - Agent Session Lifecycle: explanation/agent-session-lifecycle.md
      - Divio Content Model: explanation/divio-content-model.md
