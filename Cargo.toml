[package]
name = "openclaw"
version = "0.1.0"
edition = "2021"
description = "Experimental TUI for worktree and Agent managmenet" 

[[bin]]
name = "openswarm"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = "0.29"
portable-pty = "0.8"
vt100 = "0.15"
tachyonfx = "0.20"
ratatui-image = { version = "4.1", features = ["crossterm"] }
image = "0.25"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
